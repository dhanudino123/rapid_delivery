<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart – Flipcart</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="wrap">
  <div class="cart-grid">
    <div class="box" id="cart-box"><div class="box-head">My Cart</div><div id="cart-items"></div><div class="place-bar" id="place-bar" hidden><a class="btn order" id="go-checkout" href="checkout.html">Place order</a></div></div>
    <div class="box price-box" id="price-box" hidden>
      <h3>Price details</h3>
      <div class="coupon"><input id="promo-input" placeholder="Coupon code (FIRST50)"><button class="btn small" id="apply-promo">Apply</button></div>
      <div class="coupon-msg" id="promo-msg"></div>
      <div class="price-rows" id="price-rows"></div>
      <div class="save-msg" id="save-msg"></div>
    </div>
  </div>
</main>
<div id="site-footer"></div>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
