<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up – Flipcart</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<main>
  <div class="auth">
    <div class="auth-side"><div><h1>Looks like you're new here!</h1><p>Sign up with your email to get started</p></div><div class="art">🎁</div></div>
    <form class="auth-form" id="signup-form" novalidate>
      <div class="form-msg" id="msg" role="alert"></div>
      <div class="f"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required></div>
      <div class="f"><label for="email">Enter Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="f"><label for="password">Set Password (min 4 characters)</label><input id="password" name="password" type="password" autocomplete="new-password" required></div>
      <button class="btn" type="submit">Continue</button>
      <a class="auth-alt" href="login.html">Existing user? Log in</a>
    </form>
  </div>
</main>
<div id="site-footer"></div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
